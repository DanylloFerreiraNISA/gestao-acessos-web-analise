{% extends "base.html" %}{% block title %}Departamentos{% endblock %}{% block content %}<a class="back" href="/admin/cadastros">Voltar para cadastros</a><section class="hero compact"><p class="eyebrow">Cadastros</p><h1>Departamentos</h1></section><form method="post" class="panel inline-create"><label>Nome<input name="nome" required></label><button>Criar departamento</button></form><section class="cadastro-list">{% for item in departments %}<a href="/admin/departamentos/{{ item.id }}"><strong>{{ item.nome }}</strong><span>{{ 'Ativo' if item.ativo else 'Inativo' }}</span></a>{% else %}<div class="panel">Nenhum departamento cadastrado.</div>{% endfor %}</section>{% endblock %}
