{% extends "base.html" %}{% block title %}Entrar | Gestao de Acessos{% endblock %}{% block content %}<section class="auth-shell"><form class="auth-card" method="post"><div class="auth-mark">GA</div><h1>Gestao de Acessos</h1><p>Entre com seu e-mail corporativo ou nome de usuario.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<input type="hidden" name="next_url" value="{{ next_url or '/portal' }}"><label>E-mail ou usuario<input name="login" type="text" autocomplete="username" placeholder="nome@empresa.com ou danyllo.ferreira" required autofocus></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">Entrar</button><small>Por seguranca, a sessao encerra apos 10 minutos sem atividade.</small></form></section>{% endblock %}
