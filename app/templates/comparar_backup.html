{% extends "base.html" %}{% block title %}Comparar perfis{% endblock %}{% block content %}<section class="hero"><p class="eyebrow">Comparativo</p><h1>Comparar dois perfis</h1><p>As duas permissões aparecem em colunas alinhadas pelo mesmo caminho, tela e botão.</p></section><form class="compare-form" method="get"><select name="perfil_a" required><option value="">Perfil A</option>{% for p in perfis %}<option value="{{ p.id }}" {% if perfil_a and p.id==perfil_a.id %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}</select><select name="perfil_b" required><option value="">Perfil B</option>{% for p in perfis %}<option value="{{ p.id }}" {% if perfil_b and p.id==perfil_b.id %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}</select><input name="busca" value="{{ busca }}" placeholder="Pesquisar"><button>Comparar</button></form>{% if resultado %}<script type="application/json" id="classic-comparison-data">{{ resultado|tojson }}</script><div class="classic-toolbar"><div class="classic-modes"><button class="active" data-compare-mode="tree">Arvores alinhadas</button><button data-compare-mode="paths">Somente caminhos</button></div><input class="classic-search" data-compare-search placeholder="Pesquisar caminho, tela ou botao"></div><div class="classic-comparison" data-classic-comparison data-compare-source="classic-comparison-data" data-mode="tree"><div class="compare-header"><div>{{ perfil_a.nome }}</div><div>{{ perfil_b.nome }}</div></div><div class="compare-tree" data-compare-body></div><div class="compare-paths" data-compare-paths></div></div>{% endif %}{% endblock %}
